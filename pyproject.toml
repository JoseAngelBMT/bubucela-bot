[project]
name = "bubucela-bot"
version = "0.1.0"
description = "Discord bot to play sounds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "davey>=0.1.5",
    "discord>=2.3.2",
    "ffmpeg-python==0.2.0",
    "pydub>=0.25.1",
    "pynacl>=1.6.2",
    "python-dotenv>=1.2.2",
    "yt-dlp>=2026.1.29",
]

[dependency-groups]
dev = [
    "pylint>=3.3.0",
]

